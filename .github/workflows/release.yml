# Publish Ichiwatashi on a tag.
#
# A pure-Python package with one runtime dependency (`Pillow`), so there is no binary to build and nothing to
# sign: `pip` verifies the wheel against the index hashes.
#
# PyPI publication uses **Trusted Publishing**, not a token: the runner asks GitHub for an OIDC token, PyPI
# verifies it came from this repository, this workflow file and the environment named below, and issues a
# short-lived upload credential. Nothing secret is stored anywhere.
#
# The environment name is pinned here so that what the PyPI settings page must say is unambiguous. A mismatch
# between this string and the publisher configured on PyPI is the most common way this fails, and it fails at
# the last step of a release, after everything else has gone green.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: build and publish to PyPI
    runs-on: ubuntu-latest
    env:
      PYPI_NAME: ichiwatashi
    environment:
      name: pypi
      url: https://pypi.org/p/ichiwatashi
    permissions:
      id-token: write       # required for Trusted Publishing; without it the upload is refused
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tooling, and this project's own dependencies
        # **`.` is here because the suite imports them at module level.** The first run of this
        # workflow died at the suite step with `No module named 'PIL'`: `Pillow` is declared as this
        # package's one runtime dependency, the test module imports it while being collected, and the
        # step installed only `build` and `twine`. Installing the project itself pulls in whatever it
        # declares, so the next dependency cannot repeat this. Measured: the same suite passes in a
        # clean venv once the dependency is there.
        run: python -m pip install --upgrade build twine .

      - name: The tag must match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag declared=$declared"
          test "$tag" = "$declared" || { echo "::error::tag $tag does not match version $declared"; exit 1; }

      - name: The version must be declared in exactly one place, and agree with pyproject.toml
        # **This repository declares its version twice** -- `pyproject.toml` and `ichiwatashi/__init__.py`, which
        # reports it at run time. Two declarations can disagree, and a wheel whose metadata says 0.1.0 while
        # `ichiwatashi.__version__` says something else is a release nobody can pin. Checked rather than
        # mentioned.
        run: |
          pyproject=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          runtime=$(python -c "import re,pathlib; t=pathlib.Path('ichiwatashi/__init__.py').read_text(); m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', t); print(m.group(1) if m else 'MISSING')")
          echo "pyproject=$pyproject runtime=$runtime"
          test "$pyproject" = "$runtime" || {
            echo "::error::pyproject.toml says $pyproject but ichiwatashi.__version__ says $runtime"
            exit 1
          }

      - name: The suite must pass before anything is published
        run: python -m unittest discover -s test -t . -v

      - name: Build
        run: python -m build

      - name: Validate the distributions
        run: python -m twine check dist/*

      - name: The wheel must contain the font it looks for
        # **A build that succeeds says nothing about its contents, and this one was incomplete.** The first
        # wheel built here contained eleven `.py` files and no `assets/`, so an installed copy could not find
        # the font its own `font` command defaults to -- while the build, `twine check` and the install all
        # reported success. The sibling project shipped once without the module behind its main flag for
        # exactly the same reason. Printing the file list costs nothing and catches it at the source.
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = sorted(glob.glob("dist/*.whl"))
          assert wheels, "no wheel was built"
          for w in wheels:
              print(w)
              for name in zipfile.ZipFile(w).namelist():
                  print("   ", name)
          names = {n for w in wheels for n in zipfile.ZipFile(w).namelist()}
          required = [
              "ichiwatashi/judge.py",
              "ichiwatashi/perceptual.py",
              "ichiwatashi/frames.py",
              "ichiwatashi/figures.py",
              "ichiwatashi/palette.py",
              "ichiwatashi/assets/font5x7.txt",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              raise SystemExit("the wheel is missing %s" % missing)
          print("all %d required entries are present" % len(required))
          PY

      - name: The installed package can find its own font
        # The end-to-end check the wheel check cannot make: install it into a clean environment **and run the
        # command from a directory that is not the checkout**, because a path relative to the current working
        # directory passes here and fails for every user.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/verify/bin/ichiwatashi font --check
          echo "the installed package found its font from outside the checkout"

      - name: Is this version already on PyPI?
        # PyPI refuses to overwrite a published file, which is correct of it and is what makes a release
        # trustworthy. The consequence for CI is that re-running this workflow for an already-published
        # version used to fail at the last step -- a red X on a finished release, which teaches people to
        # ignore red Xs. So the upload is skipped with an explanation instead, and the job reports success
        # because the end state is the one it wanted.
        id: exists
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PYPI_NAME}/${version}/json")
          if [ "$code" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PYPI_NAME} ${version} is already published; skipping the upload"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "${PYPI_NAME} ${version} is not published yet (HTTP $code)"
          fi

      - name: Publish to PyPI
        if: steps.exists.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Nothing to configure: the action finds the OIDC token in the environment and PyPI matches it
          # against the publisher registered for this repository and workflow.
          packages-dir: dist/

      - name: Report the outcome
        run: |
          if [ "${{ steps.exists.outputs.already }}" = "true" ]; then
            echo "::notice::this run published nothing: the version was already on PyPI"
          else
            echo "published ${PYPI_NAME} ${GITHUB_REF_NAME#v} to PyPI"
          fi

  release-notes:
    name: attach the notes to the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create the release with the notes committed for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="RELEASE_NOTES_${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is not in the tree; a release without notes is a release nobody can review later"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Ichiwatashi ${version}" \
            --notes-file "$notes" \
            --verify-tag
